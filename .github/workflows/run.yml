name: run

on:
  workflow_dispatch:
  schedule:
    # 每天 10:30 北京时间 = 02:30 UTC (GitHub cron 一律 UTC)
    - cron: '30 2 * * *'

jobs:
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 5.5h 到点强制停止
    permissions:
      contents: read
      issues: write
    steps:
      - name: sshd key-only + cloudflared 固定隧道 (stable key)
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
        run: |
          set -e
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "missing secret SSH_PUBLIC_KEY" >&2
            exit 1
          fi

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server > /dev/null
          sudo mkdir -p /home/runner/.ssh /run/sshd
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown -R runner:runner /home/runner/.ssh
          sudo chmod 700 /home/runner/.ssh
          sudo chmod 600 /home/runner/.ssh/authorized_keys

          sudo tee /etc/ssh/sshd_config.d/99-gha.conf >/dev/null <<'CFG'
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PermitRootLogin no
          AllowUsers runner
          PubkeyAuthentication yes
          MaxAuthTries 3
          ClientAliveInterval 30
          ClientAliveCountMax 120
          LoginGraceTime 20
          CFG
          sudo /usr/sbin/sshd

          # SSH 走 cloudflared 命名隧道固定域名 (dashboard 配 Public Hostname -> tcp://localhost:22)
          # 连接方式固定不变, 无端口: 本地装好 cloudflared 即可直连
          if [ -z "${SSH_HOSTNAME:-}" ]; then
            echo "SSH_HOSTNAME secret 为空: SSH 固定隧道未启用, code-server 照常运行" >&2
          fi

          INFO=$(cat <<EOF
          ### SSH key-only (sshd + cloudflared 固定隧道)
          host: \`${SSH_HOSTNAME:-未配置 SSH_HOSTNAME}\` (固定, 无端口变化)
          authorized_keys from secret \`SSH_PUBLIC_KEY\` (stable)
          本地先装 cloudflared, 然后:
          \`\`\`
          ssh -i %USERPROFILE%\\.ssh\\gha_runner_ed25519 -o ProxyCommand="cloudflared access ssh --hostname ${SSH_HOSTNAME:-SSH_HOSTNAME}" runner@${SSH_HOSTNAME:-SSH_HOSTNAME}
          \`\`\`
          或写 ~/.ssh/config (一劳永逸):
          \`\`\`
          Host gha-runner
            HostName ${SSH_HOSTNAME:-SSH_HOSTNAME}
            User runner
            IdentityFile %USERPROFILE%\\.ssh\\gha_runner_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
          \`\`\`
          然后 \`ssh gha-runner\` 即可
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          echo "$INFO"
          echo "$INFO" >> "$GITHUB_STEP_SUMMARY"
          if gh issue view 1 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh issue reopen 1 -R "${{ github.repository }}" 2>/dev/null || true
            gh issue edit 1 -R "${{ github.repository }}" --title "SSH ${SSH_HOSTNAME:-pending} (key-only, 固定隧道)" --body "$INFO"
          else
            gh issue create -R "${{ github.repository }}" --title "SSH ${SSH_HOSTNAME:-pending} (key-only, 固定隧道)" --body "$INFO" || true
          fi

      - name: Install code-server (vscode server)
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh
          code-server --version
          mkdir -p ~/.config/code-server

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Install freebuff (every run)
        run: |
          npm install -g freebuff
          freebuff --version || npx freebuff --version || true

      - name: Start code-server + cloudflare tunnel (5.5h)
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          VSCODE_PASSWORD: ${{ secrets.VSCODE_PASSWORD }}
        run: |
          set -e
          PASS="${VSCODE_PASSWORD:-vscode123}"
          printf "bind-addr: 0.0.0.0:8080\nauth: password\npassword: %s\ncert: false\n" "$PASS" > ~/.config/code-server/config.yaml
          chmod 600 ~/.config/code-server/config.yaml

          # 本次运行凭证 (不回显 token 全文)
          RUN_TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d_%H-%M')
          echo "$RUN_TS $GITHUB_RUN_ID" > /tmp/run_id.txt
          printf '{"repo":"%s","run_id":"%s","run_number":"%s","started_bj":"%s","public_hint":"Cloudflare Zero Trust > Tunnels > Public Hostname -> http://localhost:8080"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$RUN_TS" > /tmp/creds.json
          echo "VSCODE_PASSWORD 已写入 config, 明文只存 db 私有仓, 日志不打印"

          # 1) 起 code-server
          nohup code-server --bind-addr 0.0.0.0:8080 > /tmp/code-server.log 2>&1 &
          sleep 5

          # 2) 起 cloudflared 命名隧道 (公网 -> localhost:8080)
          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          sleep 8

          echo "==================== 连接信息(只看这里) ===================="
          echo "公网地址: 去 Cloudflare Zero Trust > Networks > Tunnels 看你绑定的 Public Hostname"
          echo "  (隧道指向 http://localhost:8080, 密码 = VSCODE_PASSWORD)"
          echo "本地 code-server 自检:"
          curl -s -o /dev/null -w "  localhost:8080 HTTP %{http_code}\n" http://localhost:8080/ || true
          echo "cloudflared 日志尾:"
          tail -n 20 /tmp/cloudflared.log || true
          echo "============================================================="

          # 3) 保活 5.5h = 19800s, 到点 job 因 timeout-minutes:330 自动结束
          echo "保活开始: 19800s (5.5h)..."
          for i in $(seq 1 330); do
            sleep 60
            if ! pgrep -f "code-server.*0.0.0.0:8080" > /dev/null; then
              echo "code-server 挂了, 重启"; nohup code-server --bind-addr 0.0.0.0:8080 > /tmp/code-server.log 2>&1 &
            fi
            if ! pgrep -f "cloudflared.*tunnel.*run" > /dev/null; then
              if grep -q "not valid" /tmp/cloudflared.log 2>/dev/null; then
                echo "TUNNEL_TOKEN 无效, 停止重试 (请更新 secret 后重跑)"
              else
                echo "cloudflared 挂了, 重启"; nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
              fi
            fi
            if ! pgrep -x sshd > /dev/null && ! pgrep -f "^/usr/sbin/sshd" > /dev/null && ! (ss -ltn 2>/dev/null | grep -q ':22 '); then
              echo "sshd 挂了, 重启"; sudo /usr/sbin/sshd || true
            fi
            if [ $((i % 30)) -eq 0 ]; then echo "heartbeat ${i}/330 min..."; fi
          done

      - name: Save creds to db private repo
        if: always()
        env:
          DB_PUSH_PAT: ${{ secrets.DB_PUSH_PAT }}
          VSCODE_PASSWORD: ${{ secrets.VSCODE_PASSWORD }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
        run: |
          set -e
          [ -z "$DB_PUSH_PAT" ] && echo "DB_PUSH_PAT 为空, 跳过归档" && exit 0
          OWNER="${GITHUB_REPOSITORY%%/*}"
          DB_REPO="$OWNER/db"
          RUN_TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d_%H-%M')
          FNAME="creds/${RUN_TS}_run-${GITHUB_RUN_ID}.json"
          rm -rf /tmp/db && git clone "https://x-access-token:${DB_PUSH_PAT}@github.com/${DB_REPO}.git" /tmp/db
          mkdir -p /tmp/db/creds
          PASS_LEN=$(printf "%s" "${VSCODE_PASSWORD:-vscode123}" | wc -c)
          tail -n 50 /tmp/cloudflared.log > /tmp/cf_tail.log 2>/dev/null || true
          CF_TAIL=$(tr -d '\n' < /tmp/cf_tail.log | cut -c1-2000)
          printf '{"repo":"%s","run_id":"%s","run_number":"%s","ended_bj":"%s","password_len":%s,"note":"明文密码请以 VSCODE_PASSWORD secret 为准, 此处只存长度防泄漏"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$RUN_TS" "$PASS_LEN" > "/tmp/db/$FNAME"
          echo "$CF_TAIL" > "/tmp/db/creds/${RUN_TS}_run-${GITHUB_RUN_ID}.cf.log" || true
          printf 'ssh_host=%s\nssh_user=runner\nssh_key=gha_runner_ed25519(stable, 本地私藏)\nssh_via=cloudflared access ssh --hostname %s\n' "${SSH_HOSTNAME:-UNSET}" "${SSH_HOSTNAME:-UNSET}" > "/tmp/db/creds/${RUN_TS}_run-${GITHUB_RUN_ID}.ssh.txt" || true
          # ---- 打包 SSH(仅公钥 authorized_keys, 私钥永不离本机) + freebuff/codebuff 凭证目录 ----
          # SSH 为稳定密钥制: 私钥只在本地 %USERPROFILE%\.ssh\gha_runner_ed25519, runner 上只有 authorized_keys;
          # issue #1 即可. SSH 走 cloudflared 固定域名, 无端口变化.
          # freebuff 基于 codebuff, 登录态在 ~/.config/manicode/credentials.json (authToken),
          # 兼容兜底: ~/.config/codebuff ~/.config/freebuff ~/.codebuff ~/.freebuff + $CODEBUFF_DATA_DIR/$FREEBUFF_DATA_DIR
          MANIFEST="/tmp/db/creds/${RUN_TS}_run-${GITHUB_RUN_ID}.manifest.txt"
          { echo "run $GITHUB_RUN_ID $RUN_TS"; echo "--- ssh(stable key-only via cloudflared) ---"; echo "host: ${SSH_HOSTNAME:-UNSET}"; ls -l ~/.ssh 2>/dev/null || echo "no ~/.ssh"; echo "--- cred dirs ---"; } > "$MANIFEST"
          STAGE=/tmp/bundle_stage && rm -rf "$STAGE" && mkdir -p "$STAGE"
          [ -d ~/.ssh ] && mkdir -p "$STAGE/ssh" && cp -r ~/.ssh/. "$STAGE/ssh/" 2>/dev/null || true
          for d in "$HOME/.config/manicode" "$HOME/.config/manicode-dev" "$HOME/.config/manicode-staging" "$HOME/.config/codebuff" "$HOME/.config/freebuff" "$HOME/.codebuff" "$HOME/.freebuff" "${CODEBUFF_DATA_DIR:-}" "${FREEBUFF_DATA_DIR:-}"; do
            if [ -n "$d" ] && [ -e "$d" ]; then
              rel=$(echo "$d" | sed "s|^$HOME/||")
              mkdir -p "$STAGE/$rel"
              cp -r "$d/." "$STAGE/$rel/" 2>/dev/null || true
              echo "FOUND: $d" >> "$MANIFEST"
            else
              echo "MISS: $d" >> "$MANIFEST"
            fi
          done
          # code-server config (含本次密码) 也一并归档, 方便重连
          [ -f ~/.config/code-server/config.yaml ] && mkdir -p "$STAGE/config-code-server" && cp ~/.config/code-server/config.yaml "$STAGE/config-code-server/" || true
          find "$STAGE" -type f | head -n 50 >> "$MANIFEST" || true
          tar -czf "/tmp/db/creds/${RUN_TS}_run-${GITHUB_RUN_ID}.bundle.tar.gz" -C "$STAGE" . || echo "bundle empty/none"
          ls -l "/tmp/db/creds/${RUN_TS}_run-${GITHUB_RUN_ID}.bundle.tar.gz" >> "$MANIFEST" || true
          cd /tmp/db && git config user.name "relay-bot" && git config user.email "relay-bot@local"
          git add . && git commit -m "creds run $GITHUB_RUN_ID $RUN_TS" || echo "nothing to commit"
          git push origin HEAD:main || git push origin HEAD:master || true
